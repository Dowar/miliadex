<body>
<div><p id="m">Connexion à Google Drive…</p><p><a href="./">Retour au Miliadex</a></p></div>
<script>
(function(){
  // Google sends the user back here with a one-time code: hand it to the Miliadex page that asked for it, then close
  var q=new URLSearchParams(location.search), st=q.get("state")||"";
  var r={code:q.get("code"),state:st,error:q.get("error"),t:Date.now()};
  try{ localStorage.setItem("miliadex-oauth", JSON.stringify(r)); }catch(e){}
  try{ var bc=new BroadcastChannel("miliadex-oauth"); bc.postMessage(r); bc.close(); }catch(e){}
  var fr=(navigator.language||"").slice(0,2)!=="en";
  document.getElementById("m").textContent = r.code ? (fr?"Connecté ✓ Tu peux fermer cette fenêtre.":"Signed in ✓ You can close this window.") : (fr?"Connexion annulée.":"Sign-in cancelled.");
  if(st.charAt(0)==="r"){ location.replace("./"); return; }   // full-page sign-in: go back to the site
  setTimeout(function(){ try{ window.close(); }catch(e){} }, 120);
})();
</script>
