<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Miliadex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://static.wikia.nocookie.net">
<link rel="preconnect" href="https://static.wikia.nocookie.net" crossorigin>
<link rel="dns-prefetch" href="https://static.wikia.nocookie.net">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: Pokédex-style device shell → sticky toolbar → filter sidebar (bottom sheet under 1000px) + card grid */
:root{
  --ink:#1b1534; --shell:#2a2150; --shell-hi:#3b2f70; --shell-lo:#1d1740;
  --screen:#f2effb; --card:#ffffff; --raise:#f7f5ff; --text:#221c3d; --muted:#6b6490; --line:#ddd7f1; --chip:#ebe7fa;
  --accent:#6a4ddc; --on-accent:#ffffff; --ok:#22b07f; --lens:#5fd3ff; --warn:#e0a53c;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --tech:"Chakra Petch","Figtree",system-ui,sans-serif;
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --radius:16px; --tbh:64px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#0d0a1c; --screen:#151127; --card:#201a39; --raise:#272042; --text:#ece8ff; --muted:#a49dc8; --line:#342c5a; --chip:#2b2450; --accent:#9c85ff; --on-accent:#140f2a; color-scheme:dark;
}}
:root[data-theme="dark"]{--ink:#0d0a1c; --screen:#151127; --card:#201a39; --raise:#272042; --text:#ece8ff; --muted:#a49dc8; --line:#342c5a; --chip:#2b2450; --accent:#9c85ff; --on-accent:#140f2a; color-scheme:dark;}
.r5{--ra:#9a6326;--rb:#d9a24f;--rc:#e3a94a}
.r4{--ra:#5b479c;--rb:#9d7ddb;--rc:#9a78e6}
.r3{--ra:#2f5a8c;--rb:#5d93c9;--rc:#5b9be0}
.r2{--ra:#356b52;--rb:#64a17f;--rc:#4fb383}
.r0{--ra:#5e5b74;--rb:#9a97b1;--rc:#9a97b1}

*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(var(--tbh) + 12px)}
body{margin:0;background:var(--ink);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--lens);outline-offset:2px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- device shell ---------- */
.device{max-width:1320px;margin:0 auto;padding:12px 12px 32px}
.top{position:relative;overflow:hidden;isolation:isolate;border-radius:28px 28px 10px 10px;padding:18px 22px 16px;color:#f3efff;
  background:radial-gradient(120% 160% at 0% 0%,#45318f 0%,#271c58 42%,#140e31 100%);box-shadow:inset 0 -4px 0 rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.1)}
.sky{position:absolute;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.aur{position:absolute;border-radius:50%;filter:blur(40px);mix-blend-mode:screen;animation:drift 16s ease-in-out infinite alternate}
.a1{width:46%;height:130%;left:-10%;top:-40%;background:#7b5cff;opacity:.5}
.a2{width:36%;height:100%;right:-8%;top:-45%;background:#2fb8ff;opacity:.32;animation-duration:21s}
.a3{width:42%;height:90%;left:36%;bottom:-62%;background:#ff9f5a;opacity:.22;animation-duration:26s}
@keyframes drift{to{transform:translate(9%,12%) scale(1.15)}}
.starfield{position:absolute;inset:0;opacity:.75;animation:twinkle 3.6s ease-in-out infinite alternate;background-image:radial-gradient(1.5px 1.5px at 12% 22%,#fff,transparent 70%),radial-gradient(1px 1px at 27% 68%,#fff,transparent 70%),radial-gradient(1.3px 1.3px at 44% 14%,#fff,transparent 70%),radial-gradient(1px 1px at 58% 52%,#fff,transparent 70%),radial-gradient(1.7px 1.7px at 73% 28%,#fff,transparent 70%),radial-gradient(1px 1px at 86% 76%,#fff,transparent 70%),radial-gradient(1.3px 1.3px at 93% 12%,#fff,transparent 70%),radial-gradient(1px 1px at 35% 40%,#fff,transparent 70%),radial-gradient(1.4px 1.4px at 64% 88%,#fff,transparent 70%),radial-gradient(1px 1px at 6% 82%,#fff,transparent 70%),radial-gradient(1.2px 1.2px at 80% 46%,#fff,transparent 70%),radial-gradient(1px 1px at 20% 50%,#fff,transparent 70%)}
@keyframes twinkle{to{opacity:.3}}
.hero{display:flex;gap:24px;align-items:center}
.orbit{flex:none;width:150px;height:150px}
.orbit svg{width:100%;height:100%;display:block;overflow:visible}
.orbit .arc{transition:stroke-dasharray 1s cubic-bezier(.2,.8,.2,1)}
.orbit .head{transform-origin:70px 70px;transition:transform 1s cubic-bezier(.2,.8,.2,1)}
.orbit .spin{transform-origin:70px 70px;animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hero-main{flex:1;min-width:0;display:grid;gap:10px}
.brand{display:flex;align-items:center;gap:12px}
.brand h1{font-family:var(--tech);font-weight:700;font-size:clamp(22px,3.4vw,32px);letter-spacing:.16em;margin:0;line-height:1;text-shadow:0 0 18px rgba(170,150,255,.6)}
.seg{position:relative;isolation:isolate;display:inline-flex;background:rgba(0,0,0,.28);border-radius:999px;padding:3px;gap:2px;--seg-on:#fff}
.seg > .pill{position:absolute;left:0;top:0;z-index:-1;border-radius:999px;background:var(--seg-on);box-shadow:0 2px 10px color-mix(in srgb,var(--seg-on) 35%,transparent);pointer-events:none;transition:transform .45s cubic-bezier(.3,1.25,.45,1),width .45s cubic-bezier(.3,1.25,.45,1),height .3s}
.seg.has-pill button[aria-pressed="true"]{background:transparent!important}
.seg button{transition:color .3s ease}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 12px;font-weight:600;font-size:13px;color:inherit;white-space:nowrap}
.seg button[aria-pressed="true"]{background:#fff;color:var(--shell)}
.top .seg{margin-left:auto;font-family:var(--tech);background:rgba(0,0,0,.32)}
.rank{display:flex;align-items:center;gap:12px;min-width:0}
.crest{flex:none;position:relative;isolation:isolate;width:46px;height:52px}
.crest::before{content:"";position:absolute;inset:-8px;z-index:-1;border-radius:50%;background:radial-gradient(circle,var(--glow,#c58cff) 0%,transparent 66%);opacity:.22;animation:fxCrestGlow 4.5s ease-in-out infinite;pointer-events:none}
@keyframes fxCrestGlow{50%{opacity:.5;transform:scale(1.08)}}
.crest svg{width:100%;height:100%;display:block;filter:drop-shadow(0 0 10px var(--glow,#c58cff))}
.rk{min-width:0}
.rk-top{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px}
.rk-label{white-space:nowrap}
.rk-top .info-btn{flex:none}
.info-btn{width:20px;height:20px;border-radius:50%;border:1.5px solid rgba(255,255,255,.55);background:rgba(255,255,255,.08);color:#fff;font-family:var(--serif);font-style:italic;font-weight:650;font-size:12px;line-height:1;display:grid;place-items:center;padding:0;transition:background .2s,transform .2s}
.info-btn:hover{background:rgba(255,255,255,.22);transform:scale(1.1)}
#info{width:min(560px,calc(100% - 24px))}
.ih{display:flex;align-items:center;gap:12px;padding:16px 18px 10px;background:linear-gradient(160deg,#2b1f5c,#171133);color:#fff}
.ih h2{margin:0;font-family:var(--serif);font-size:22px;font-weight:650}
.ih .dx{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}
.ib{overflow:auto;padding:14px 18px 18px;display:grid;gap:10px}
.ib p{margin:0;font-size:13.5px;color:var(--muted);max-width:62ch}
.ib .ipts{color:var(--text);font-weight:700;font-family:var(--tech)}
.rlist{list-style:none;margin:4px 0 0;padding:0;display:grid;gap:8px}
.ri{display:flex;align-items:center;gap:12px;padding:8px 12px 8px 8px;border-radius:14px;border:2px solid var(--line);background:var(--raise)}
.ri-crest{flex:none;width:38px;height:43px}
.ri-crest svg{width:100%;height:100%;display:block}
.ri-txt{flex:1;min-width:0;display:grid}
.ri-txt b{font-family:var(--serif);font-weight:650;font-size:16px}
.ri-txt small{font-family:var(--tech);font-size:12px;color:var(--muted)}
.ri-st{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.ri.reached .ri-st{color:var(--ok)}
.ri.current{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.ri.current .ri-st{color:var(--accent)}
.ri.locked .ri-crest{filter:grayscale(1) opacity(.55)}
.rk-label{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#b9adf5}
.rk-name{font-family:var(--serif);font-weight:650;font-size:clamp(21px,3.1vw,31px);line-height:1.08;background:linear-gradient(92deg,#fff2c9 0%,#ffc36b 35%,#f0b8ff 68%,#9fe6ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;text-wrap:balance}
.xp{display:grid;gap:5px;max-width:540px}
.xp-bar{height:9px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.4)}
.xp-bar i{display:block;height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,#7b5cff,#c58cff,#5fd3ff);box-shadow:0 0 12px rgba(95,211,255,.8);transition:width 1s cubic-bezier(.2,.8,.2,1);position:relative;overflow:hidden}
.xp-bar i::after,.rb .track i::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 20%,rgba(255,255,255,.55) 50%,transparent 80%);transform:translateX(-100%);animation:shine 3.4s ease-in-out infinite}
@keyframes shine{60%,100%{transform:translateX(100%)}}
.xp-txt{font-size:12.5px;color:#d3caff}
.hero-stats{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.6fr);gap:24px;align-items:center;margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.1)}
.rbars{display:grid;gap:7px;grid-auto-rows:18px;align-content:space-between;min-height:calc(4 * 18px + 3 * 7px)}
.rb{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;font-family:var(--tech);font-size:12.5px;font-variant-numeric:tabular-nums;color:#cfc6ff}
.rb .lab{color:var(--rc);letter-spacing:1px;font-weight:700}
.rb .track{height:8px;border-radius:5px;background:rgba(255,255,255,.1);overflow:hidden}
.rb .track i{display:block;height:100%;width:0;border-radius:5px;background:linear-gradient(90deg,var(--ra),var(--rb));transition:width 1s cubic-bezier(.2,.8,.2,1);position:relative;overflow:hidden}
.rb b{color:#fff}
.constel{position:relative;display:flex;justify-content:space-between;gap:4px;overflow-x:auto;scrollbar-width:none;padding:12px 12px 4px;margin:-10px -10px -4px}
.constel::-webkit-scrollbar{display:none}
.constel::before{content:"";position:absolute;left:34px;right:34px;top:33px;height:2px;background:linear-gradient(90deg,rgba(255,255,255,.06),rgba(190,170,255,.5),rgba(255,255,255,.06))}
.node{position:relative;flex:none;display:grid;justify-items:center;gap:3px;min-width:44px;border:0;background:none;padding:0;color:#cfc6ff;font-family:var(--tech);font-size:11px;font-weight:600;font-variant-numeric:tabular-nums}
.node svg{width:44px;height:44px;display:block;transition:transform .2s}
.node:hover svg{transform:scale(1.1)}
.node .na{transition:stroke-dasharray 1s cubic-bezier(.2,.8,.2,1)}
.node.done{color:#ffe3a3}
.node.done .na{stroke:#ffd27a}
.node.done svg{filter:drop-shadow(0 0 7px rgba(255,200,100,.9))}
.top.levelup .orbit svg{animation:lvl 1.3s ease}
.top.levelup .rk-name{animation:lvlt 1.3s ease}
@keyframes lvl{30%{transform:scale(1.13) rotate(-5deg);filter:drop-shadow(0 0 26px #ffd27a)}}
@keyframes lvlt{30%{transform:scale(1.06);filter:drop-shadow(0 0 14px #ffc36b)}}

.screen{background:var(--screen);border-radius:10px 10px 24px 24px;margin-top:6px;border:6px solid var(--shell);padding:0 14px 18px;min-height:70vh}

/* ---------- tabs + toolbar ---------- */
.tabs{position:relative;isolation:isolate;display:flex;gap:4px;width:fit-content;max-width:100%;margin-top:12px;padding:4px;border-radius:17px;background:var(--chip);box-shadow:inset 0 1px 2px rgba(20,10,60,.12)}
.tab{flex:1 1 0;width:250px;min-width:0;display:flex;align-items:center;justify-content:space-between;gap:10px;border:0;background:transparent;border-radius:13px;padding:10px 14px;text-align:left;color:var(--text);transition:color .3s,background .2s}
.tab b{font-family:var(--serif);font-weight:650;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab span{font-family:var(--tech);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;transition:color .3s}
.tab:not([aria-selected="true"]):hover{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.tab[aria-selected="true"]{color:var(--on-accent)}
.tab[aria-selected="true"] span{color:color-mix(in srgb,var(--on-accent) 78%,transparent)}
.tabs:not(.has-pill) .tab[aria-selected="true"]{background:var(--accent)}
.tabs > .tab-ind{position:absolute;left:0;top:0;z-index:-1;border-radius:13px;pointer-events:none;background:var(--accent);box-shadow:0 3px 14px color-mix(in srgb,var(--accent) 40%,transparent),inset 0 1px 0 rgba(255,255,255,.22);transition:transform .45s cubic-bezier(.3,1.25,.45,1),width .45s cubic-bezier(.3,1.25,.45,1),height .3s}

.toolbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--screen);display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 0;margin-top:2px;border-bottom:1px solid var(--line)}
.search{flex:1 1 260px;position:relative;min-width:0}
.search input{width:100%;padding:10px 14px 10px 38px;border-radius:12px;border:2px solid var(--line);background:var(--card)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.toolbar .seg{background:var(--chip);--seg-on:var(--accent)}
.toolbar .seg > .pill{transition-duration:.22s,.22s,.2s;transition-timing-function:cubic-bezier(.25,1.15,.4,1)}
.toolbar .seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.toolbar select{padding:9px 10px;border-radius:12px;border:2px solid var(--line);background:var(--card);max-width:100%}
.ci{display:inline-block;flex:none;width:1em;height:1em;background-color:currentColor;-webkit-mask:var(--i) center/contain no-repeat;mask:var(--i) center/contain no-repeat}
.ci-all{--i:url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAYAAACqaXHeAAAAuklEQVR42u3ayw2DMBBAQZy+zQHRAYWQDp2rLyFOWATEMw2s/UAgPsMAAMBnpZS17LM0zFh2zliP2nyUeWPGHDXkake+aXElVtOZkFqPfmTQlFI6c07t0ft1TQABBBBAAAEEEEAAAQQQQIANY+DM8QJzvhf0tiY3zMlHvnUCgN9ug9ONboNT9OZz4AeLfPacmg8jngUEEEAAAQQQQAABBBBAAAEEeOt5w73FrrnrX2WrBfb7szQAwL95AfvNo7fnlRWpAAAAAElFTkSuQmCC)}

.subtabs{flex:1 1 100%;order:10;display:flex;flex-wrap:wrap;align-items:center;gap:4px;padding:2px 0 0}
.subtabs[hidden]{display:none}
.stab{position:relative;flex:none;width:var(--sz,44px);height:var(--sz,44px);display:grid;place-items:center;border:2px solid transparent;background:var(--chip);color:var(--muted);border-radius:12px;padding:0;font-size:calc(var(--sz,44px)*.5);transition:background .15s,border-color .15s,color .15s,transform .15s}
.stab:hover{color:var(--text);border-color:var(--accent)}
.stab:active{transform:scale(.94)}
.stab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 35%,transparent)}
.stab.done::after{content:"";position:absolute;top:3px;right:3px;width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 2px var(--chip)}
.stab[aria-selected="true"].done::after{box-shadow:0 0 0 2px var(--accent)}
.stab[data-tip]:hover::before{content:attr(data-tip);position:absolute;top:calc(100% + 7px);left:50%;transform:translateX(-50%);background:var(--text);color:var(--screen);font-family:var(--body);font-size:12px;font-weight:600;line-height:1.2;padding:5px 9px;border-radius:8px;white-space:nowrap;z-index:40;pointer-events:none;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.st-sep{flex:none;width:2px;height:26px;border-radius:2px;background:var(--line);margin:0 4px}
.st-cur{display:flex;align-items:baseline;gap:8px;margin-left:10px;font-family:var(--serif);font-size:17px;font-weight:650;white-space:nowrap}
.st-cur small{font-family:var(--tech);font-size:12.5px;font-weight:500;color:var(--muted)}
.st-cur small.ok{color:var(--ok)}
@media (hover:none){ .stab[data-tip]:hover::before{display:none} }
.fbtn{display:none;align-items:center;gap:8px;border:2px solid var(--line);background:var(--card);border-radius:12px;padding:8px 12px;font-weight:600}
.fbtn b{background:var(--accent);color:var(--on-accent);border-radius:999px;font-size:12px;min-width:20px;height:20px;display:inline-grid;place-items:center;padding:0 6px}
.active{display:flex;flex-wrap:wrap;gap:6px;padding-top:10px}
.active:empty{display:none}
.pill{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--chip);border-radius:999px;padding:5px 10px;font-size:12.5px;font-weight:600}
.pill i{font-style:normal;opacity:.6}
.pill.clear{background:transparent;color:var(--accent);text-decoration:underline;text-underline-offset:2px}

/* ---------- body: filters + list ---------- */
.body{display:grid;grid-template-columns:250px minmax(0,1fr);gap:18px;align-items:start;padding-top:8px}
.filters{position:sticky;top:calc(var(--tbh) + 8px);max-height:calc(100vh - var(--tbh) - 24px);overflow:auto;padding:8px 2px 12px;overscroll-behavior:contain}
.sheet-head{display:none}
.fg{padding:10px 0;border-bottom:1px solid var(--line)}
.fg:last-of-type{border-bottom:0}
.fg h3{margin:0 0 8px;font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.fg h4{margin:8px 0 6px;font-size:12px;font-weight:600;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--card);border-radius:999px;padding:5px 10px;font-size:13px;font-weight:500;transition:background .15s,border-color .15s}
.chip small{font-family:var(--tech);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--text);border-color:var(--text);color:var(--screen)}
.chip[aria-pressed="true"] small{color:inherit;opacity:.75}
.chip.zero:not([aria-pressed="true"]){opacity:.45}
.chip .sw{width:10px;height:10px;border-radius:50%;background:var(--sc)}
.freset{margin-top:12px;border:0;background:transparent;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:2px;padding:4px 0}
.scrim{position:fixed;inset:0;background:rgba(12,8,30,.55);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}

/* ---------- groups + cards ---------- */
.group{margin-bottom:8px}
.ghead{display:flex;align-items:center;gap:12px;margin:14px 2px 10px}
.ghead h2{font-family:var(--serif);font-weight:650;font-size:21px;margin:0;line-height:1.1;text-wrap:balance}
.ghead h2 small{font-family:var(--tech);font-weight:500;font-size:13px;color:var(--muted);margin-left:6px}
.gprog{margin-left:auto;display:flex;align-items:center;gap:8px;font-family:var(--tech);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{width:110px;height:7px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:4px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.group.done .ghead h2::after{content:" ✓";color:var(--ok)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px}
.comp .grid{grid-template-columns:repeat(auto-fill,minmax(142px,1fr))}
.card{position:relative;background:var(--card);border-radius:var(--radius);border:2px solid var(--line);display:flex;flex-direction:column;overflow:hidden;transition:border-color .25s,transform .2s}
/* each block paints only inside itself (content-visibility), so it gets 14px of padding (cancelled by a negative margin) as room for tilted cards and their glow */
.blk{content-visibility:auto;contain-intrinsic-size:auto 900px;padding:14px;margin:-14px}
.blk + .blk{margin-top:-16px}
.card.complete{border-color:var(--rc)}
.card.complete::after{content:"";position:absolute;inset:0;border-radius:calc(var(--radius) - 2px);box-shadow:inset 0 0 0 2px var(--rc);pointer-events:none}
.art{position:relative;aspect-ratio:1/1;max-width:100%;background:linear-gradient(160deg,var(--ra),var(--rb))}
.shot{position:absolute;inset:0;border:0;padding:0;background:none;display:flex;cursor:pointer;overflow:hidden}
.half{position:relative;flex:1;min-width:0;overflow:hidden;transition:background .45s ease}
.half.dim{background:rgba(16,12,34,.6)}
.half + .half{border-left:2px solid rgba(255,255,255,.55)}
.half svg,.half img{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover;transition:filter .45s ease,transform .45s ease}
.split .half img{object-position:50% 20%;transform:scale(1.25);transform-origin:50% 15%}
.dim svg,.dim img{filter:grayscale(1) brightness(.5) contrast(1.05)}
.stars{position:absolute;left:8px;top:6px;font-size:12px;letter-spacing:1px;color:#ffe6a6;text-shadow:0 1px 2px rgba(0,0,0,.6);pointer-events:none}
.r4 .stars,.r3 .stars,.r2 .stars{color:#fff}
.gbadge{position:absolute;right:7px;top:6px;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:rgba(20,14,40,.62);color:#fff;pointer-events:none}
.orbs{position:absolute;left:0;right:0;bottom:8px;display:flex;justify-content:space-between;padding:0 8px;pointer-events:none}
.orbs.one{justify-content:flex-end}
.orb{pointer-events:auto;position:relative;width:38px;height:38px;border-radius:50%;border:2px solid rgba(255,255,255,.9);background:rgba(20,14,40,.72);color:#fff;display:grid;place-items:center;padding:0;transition:transform .15s,background .2s}
.orb:hover{transform:scale(1.08)}
.orb:active{transform:scale(.92)}
.orb svg{width:18px;height:18px}
.orb .g{position:absolute;bottom:-4px;right:-4px;font-size:10px;font-weight:700;background:#fff;color:#2a2150;border-radius:999px;width:16px;height:16px;display:grid;place-items:center;line-height:1}
.orb[aria-pressed="true"]{background:var(--rc);border-color:#fff}
.orb .plus{display:block}.orb .check{display:none}
.orb[aria-pressed="true"] .plus{display:none}.orb[aria-pressed="true"] .check{display:block}
.meta{padding:9px 10px 11px;display:grid;grid-template-columns:minmax(0,1fr);gap:4px;align-content:start;flex:1;min-width:0}
.meta .no{font-family:var(--tech);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.mrow{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:2px 6px;min-width:0}
.mrow .chips{display:inline-flex;align-items:center;gap:7px;margin-left:auto}
.vvi{width:1.35em;height:1.35em;flex:none;object-fit:contain;vertical-align:-.3em}
.vvp{display:inline-flex;align-items:center;gap:2px;font-family:var(--tech);font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.vlines{display:grid;gap:4px;margin:-2px 0 2px}
.vline .vvi{width:22px;height:22px}
.cnp s,.vline s{opacity:.75}
.cnp.b-o4f{color:var(--muted)}
.rc-lv{display:inline-flex;align-items:center;gap:4px;margin-left:0;flex:none;white-space:nowrap;padding:2px 9px 2px 4px;border-radius:999px;background:rgba(10,6,30,.35);border:1px solid rgba(255,255,255,.18);font-family:var(--tech);font-size:12px;color:#fff;cursor:help}
.rc-lv .vvi{width:20px;height:20px}
.cni{width:1.25em;height:1.25em;flex:none;object-fit:contain;vertical-align:-.28em}
.cnp{display:inline-flex;align-items:center;gap:3px;font-family:var(--tech);font-size:12px;font-weight:600;color:#7fb4ff;white-space:nowrap;font-variant-numeric:tabular-nums}
.cnp small{font-size:10.5px;opacity:.75;margin-left:1px}
.cnp.b-o5,.cnp.b-a{color:#ffcf7a}
:root:not([data-theme="dark"]) .cnp{color:#3f6fd1}
:root:not([data-theme="dark"]) .cnp.b-o5,:root:not([data-theme="dark"]) .cnp.b-a{color:#b7791f}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .cnp{color:#7fb4ff} :root:not([data-theme="light"]) .cnp.b-o5,:root:not([data-theme="light"]) .cnp.b-a{color:#ffcf7a} }
.vline{display:inline-flex;align-items:center;flex-wrap:wrap;gap:6px;font-size:13px;color:var(--muted);line-height:1.35}
.vline b{font-family:var(--tech);font-size:15px;color:var(--text);font-variant-numeric:tabular-nums}
.vline .cni{width:20px;height:20px}

.worth{margin-left:auto;display:flex;align-items:center;gap:10px;padding:6px 12px 6px 8px;border-radius:999px;background:rgba(10,6,30,.35);border:1px solid rgba(160,190,255,.28);box-shadow:inset 0 0 18px rgba(95,140,255,.18);cursor:pointer;font:inherit;color:inherit;text-align:left;transition:transform .2s,box-shadow .2s,border-color .2s}
.worth:hover{border-color:rgba(160,190,255,.65);box-shadow:inset 0 0 18px rgba(95,140,255,.3),0 6px 22px rgba(60,110,255,.35)}
.worth:focus-visible{outline:2px solid #9fe6ff;outline-offset:2px}
.worth .w-go{width:15px;height:15px;flex:none;color:#c4cdf5;opacity:.65;transition:transform .2s,opacity .2s}
.worth:hover .w-go{opacity:1;transform:translateX(2px)}
.worth .cni{width:34px;height:34px;filter:drop-shadow(0 0 8px rgba(110,160,255,.75))}
.w-txt{display:grid;line-height:1.1}
.worth + .seg{margin-left:0}
.w-txt b{font-family:var(--tech);font-size:clamp(17px,2.3vw,22px);font-weight:700;letter-spacing:.02em;color:#eaf1ff;text-shadow:0 0 14px rgba(110,160,255,.65);font-variant-numeric:tabular-nums}
.w-txt small{font-size:11px;color:#c4cdf5;white-space:nowrap}
.meta h3{font-family:var(--serif);font-weight:600;font-size:15px;line-height:1.2;margin:0;overflow-wrap:anywhere}
.meta .sub{font-size:12px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.tag{max-width:100%;overflow:hidden;text-overflow:ellipsis;font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;background:color-mix(in srgb,var(--sc) 18%,var(--card));color:color-mix(in srgb,var(--sc) 70%,var(--text));white-space:nowrap}
.empty{padding:60px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;font-family:var(--serif);font-size:20px;color:var(--text);margin-bottom:6px}

.iconbtn{flex:none;width:42px;height:42px;display:grid;place-items:center;border:2px solid var(--line);background:var(--card);border-radius:12px;color:var(--text);padding:0}
.iconbtn svg{width:20px;height:20px;transition:transform .25s}
.iconbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.iconbtn[aria-pressed="true"] svg{transform:scaleY(-1)}
.setlink{display:inline-flex;align-items:center;gap:5px;max-width:100%;border:0;background:none;padding:0;color:var(--accent);font-size:12px;font-weight:700;text-align:left}
.setlink svg{flex:none;width:13px;height:13px}
.setlink span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.setlink:hover span{text-decoration:underline}
.orb.via{border-style:dashed;background:color-mix(in srgb,var(--rc) 55%,rgba(20,14,40,.5))}
@keyframes nope{20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
.orb.nope{animation:nope .35s}
.catch.via{border-style:dashed}
.pieces{display:grid;gap:6px;margin-top:6px}
.plbl{font-size:12.5px;font-weight:700;color:var(--muted)}
.plbl span{font-family:var(--tech)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px}
.pc{position:relative;aspect-ratio:1/1;max-width:100%;padding:0;border:2px solid transparent;border-radius:10px;overflow:hidden;background:linear-gradient(160deg,var(--ra),var(--rb));transition:transform .15s}
.pc img{width:100%;height:100%;object-fit:cover;display:block}
.pc.dim{border-color:var(--line)}
.pc.dim img{filter:grayscale(1) brightness(.55)}
.pc.dim::after{content:"";position:absolute;inset:0;background:rgba(16,12,34,.45)}
.pc:hover{transform:translateY(-2px)}
.setcard{display:flex;align-items:center;gap:10px;width:100%;border:2px solid var(--line);background:var(--raise);border-radius:14px;padding:8px 12px 8px 8px;text-align:left;color:var(--text);margin-bottom:6px}
.setcard .sc-img{flex:none;width:52px;height:52px;border-radius:10px;overflow:hidden;background:linear-gradient(160deg,var(--ra),var(--rb))}
.setcard img{width:100%;height:100%;object-fit:cover;display:block}
.setcard .sc-txt{flex:1;min-width:0;display:grid}
.setcard small{color:var(--muted);font-size:12px}
.setcard b{font-family:var(--serif);font-size:16px;font-weight:650}
.setcard > svg{flex:none;width:18px;height:18px;color:var(--accent)}
.setcard:hover{border-color:var(--accent)}
.dback{display:block;border:0;background:none;color:var(--accent);font-weight:700;padding:0 0 4px;font-size:13px}

/* source colors */
.s-ode{--sc:#d4893a}.s-asc{--sc:#c9592f}.s-std{--sc:#3f86c6}.s-pass{--sc:#7a59d6}.s-shop{--sc:#cf4f87}.s-evt{--sc:#2f9e74}.s-gift{--sc:#c7a12c}.s-wl{--sc:#2ea0a6}.s-def{--sc:#8a879f}.s-misc{--sc:#8a879f}

/* ---------- catch feedback ---------- */
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(.965)}100%{transform:scale(1)}}
@keyframes flash{0%{filter:brightness(1.9) saturate(1.3)}100%{filter:none}}
@keyframes ring{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.6);opacity:0}}
@keyframes spark{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.card.pop{animation:pop .38s ease}
.half.flash img,.half.flash svg{animation:flash .6s ease}
.orb .wave{position:absolute;inset:-2px;border-radius:50%;border:3px solid var(--rc);animation:ring .55s ease-out forwards;pointer-events:none}
.spark{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--rc);box-shadow:0 0 6px var(--rc);animation:spark .6s ease-out forwards;pointer-events:none;z-index:3}

/* ---------- account value page ---------- */
#val{--vt:#f3efff;--vm:#b8b0e6;--vl:rgba(255,255,255,.12);--vc:rgba(255,255,255,.05);width:min(1100px,calc(100% - 24px));height:calc(100dvh - 24px);max-height:none;background:radial-gradient(130% 90% at 50% -10%,#3a2a86 0%,#1d1550 38%,#110b2a 75%);color:var(--vt);border-radius:26px;box-shadow:0 30px 90px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.12);position:relative}
#val[open]{animation:vpopen .55s cubic-bezier(.2,.9,.2,1)}
#val::backdrop{background:rgba(8,5,22,.74);backdrop-filter:blur(6px)}
#val[open]::backdrop{animation:vpfade .4s ease}
@keyframes vpopen{from{opacity:0;transform:translateY(18px) scale(.95)}}
@keyframes vpfade{from{opacity:0}}
.vp-sky{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.vp-sky .aur{opacity:.35}
.vp-sky .a3{opacity:.1;background:#c58cff}
.vp-shoot{position:absolute;width:140px;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.9));transform:rotate(-24deg);opacity:0;animation:vpShoot 9s linear infinite}
.vp-shoot.s2{animation-duration:13s;animation-delay:5s;width:100px}
@keyframes vpShoot{0%{opacity:0;transform:translate(0,0) rotate(-24deg)}2%{opacity:1}9%{opacity:0;transform:translate(-520px,232px) rotate(-24deg)}100%{opacity:0;transform:translate(-520px,232px) rotate(-24deg)}}
#val > :not(.vp-sky):not(.vp-tip){position:relative;z-index:1}
.vp-head{display:flex;align-items:center;gap:12px;padding:14px 16px 0 22px}
.vp-kick{font-family:var(--tech);font-size:12px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:#b9adf5}
.vp-head .dx{background:rgba(255,255,255,.06);color:#fff;border-color:rgba(255,255,255,.3)}
.vp-scroll{flex:1;min-height:0;overflow:auto;padding:0 26px 28px;overscroll-behavior:contain;scrollbar-color:rgba(255,255,255,.25) transparent}
/* hero */
.vp-hero{display:grid;justify-items:center;text-align:center;padding:0 0 20px}
.vp-hero h2{margin:0 0 6px;font-family:var(--serif);font-weight:600;font-size:15px;color:#cfc6ff}
.vp-gem{position:relative;width:150px;height:150px;display:grid;place-items:center}
.vp-gem > img{position:relative;z-index:2;width:96px;height:96px;filter:drop-shadow(0 0 22px rgba(110,160,255,.95)) drop-shadow(0 0 4px rgba(255,255,255,.6));animation:vpGemf 4.5s ease-in-out infinite}
.vp-rays{position:absolute;inset:-60px;border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(160,190,255,.22) 0deg 4deg,transparent 4deg 18deg);-webkit-mask:radial-gradient(circle,#000 18%,transparent 66%);mask:radial-gradient(circle,#000 18%,transparent 66%);animation:spin 36s linear infinite;z-index:0}
.vp-ring{position:absolute;inset:8px;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 6%,#9fe6ff 14%,transparent 26% 40%,#c58cff 50%,transparent 62% 74%,#ffe08a 84%,transparent 94%);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2.5px),#000 calc(100% - 2px));mask:radial-gradient(farthest-side,transparent calc(100% - 2.5px),#000 calc(100% - 2px));animation:spin 10s linear infinite;z-index:1}
.vp-halo{position:absolute;inset:26px;border-radius:50%;background:radial-gradient(circle,rgba(95,140,255,.5),rgba(95,140,255,0) 70%);animation:vpGemp 3.2s ease-in-out infinite;z-index:1}
.vp-orb{position:absolute;inset:var(--in);border-radius:50%;animation:spin var(--sp) linear infinite;z-index:3}
.vp-orb::before{content:"";position:absolute;top:-3px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--oc);box-shadow:0 0 10px 2px var(--oc)}
.vp-orb.o2{animation-direction:reverse}
.vp-wave{position:absolute;inset:20px;border-radius:50%;border:2px solid rgba(159,230,255,.9);box-shadow:0 0 24px rgba(159,230,255,.6),inset 0 0 24px rgba(159,230,255,.4);animation:vpWave 1.1s cubic-bezier(.1,.7,.3,1) forwards;pointer-events:none;z-index:1}
.vp-wave.w2{animation-delay:.14s;border-color:rgba(255,224,138,.8)}
@keyframes vpWave{from{transform:scale(.5);opacity:1}to{transform:scale(2.6);opacity:0}}
.vp-spark{position:absolute;left:50%;top:50%;width:var(--s);height:var(--s);margin:calc(var(--s)/-2);border-radius:50%;background:var(--sc);box-shadow:0 0 8px 2px var(--sc);animation:vpSpark 1.1s cubic-bezier(.15,.75,.3,1) var(--dl) forwards;pointer-events:none;z-index:3;opacity:0}
@keyframes vpSpark{0%{opacity:1;transform:rotate(var(--a)) translateY(0) scale(1)}100%{opacity:0;transform:rotate(var(--a)) translateY(var(--r)) scale(.3)}}
@keyframes vpGemf{50%{transform:translateY(-6px) rotate(-4deg) scale(1.03)}}
@keyframes vpGemp{50%{transform:scale(1.25);opacity:.5}}
.vp-gem.land > img{animation:vpGemland .7s cubic-bezier(.3,1.6,.5,1),vpGemf 4.5s .7s ease-in-out infinite}
@keyframes vpGemland{40%{transform:scale(1.22);filter:drop-shadow(0 0 40px rgba(159,230,255,1)) brightness(1.4)}}
.vp-num{margin-top:4px}
.vp-num b{display:inline-flex;justify-content:center;font-family:var(--tech);font-weight:700;font-size:clamp(46px,8.5vw,84px);line-height:1;letter-spacing:.01em;font-variant-numeric:tabular-nums;filter:drop-shadow(0 0 24px rgba(110,160,255,.5));transition:filter .6s}
.vp-num.lit b{filter:drop-shadow(0 0 30px rgba(159,230,255,.9)) drop-shadow(0 0 2px rgba(255,255,255,.8))}
.vp-num b i,.od-c{font-style:normal;display:block;height:1em;background:linear-gradient(180deg,#fff 15%,#cfe0ff 55%,#8eaefc 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.od-c{display:inline-block}
.od-d{display:inline-block;height:1em;overflow:hidden}
.od-s{display:block;transform:translateY(0);transition:transform var(--t) cubic-bezier(.55,.05,.22,1)}
.vp-num.go .od-s{transform:translateY(calc(var(--d) * -1em))}
.vp-num .lab{display:block;margin-top:8px;font-family:var(--tech);font-size:12.5px;font-weight:600;letter-spacing:.28em;text-transform:uppercase;color:#a9b8f0}
.vp-money{position:relative;overflow:hidden;margin-top:16px;display:inline-flex;align-items:baseline;gap:10px;padding:8px 18px;border-radius:999px;background:linear-gradient(90deg,rgba(255,224,138,.16),rgba(197,140,255,.14));border:1px solid rgba(255,224,138,.42);box-shadow:0 0 24px rgba(255,200,110,.12)}
.vp-money::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,245,210,.5) 50%,transparent 65%);transform:translateX(-120%);animation:vpGlare 5s 2.2s ease-in-out infinite}
.vp-money b{font-family:var(--tech);font-size:22px;font-weight:700;color:#ffe7a8}
.vp-money small{font-size:12.5px;color:#d8cfae}
.vp-eq{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:14px}
.vp-eq span{padding:5px 12px;border-radius:999px;background:var(--vc);border:1px solid var(--vl);font-size:13px;color:#ddd6ff}
.vp-eq b{font-family:var(--tech);font-weight:700;color:#fff}
@keyframes vpGlare{0%{transform:translateX(-120%)}22%,100%{transform:translateX(120%)}}
/* reveal: everything waits (paused at its first frame) until its section scrolls into view */
.rv{opacity:0;transform:translateY(26px);transition:opacity .7s ease,transform .8s cubic-bezier(.2,.8,.2,1)}
.rv.in{opacity:1;transform:none}
.rv .an{animation-play-state:paused!important}
.rv.in .an{animation-play-state:running!important}
.vp-eq span.an{animation:vpPop .5s cubic-bezier(.3,1.5,.5,1) backwards}
@keyframes vpPop{from{opacity:0;transform:scale(.6)}}
/* composition bar: segments drop in one by one, then a vpGlare sweeps across */
.vp-bar{position:relative;display:flex;gap:2px;height:22px;border-radius:8px;overflow:hidden;margin:2px 0 10px;background:rgba(255,255,255,.04)}
.vp-bar i{display:block;height:100%;min-width:4px;background:var(--c);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -2px 0 rgba(0,0,0,.18);transition:filter .15s}
.vp-bar i.an{animation:vpSegdrop .75s cubic-bezier(.3,1.45,.5,1) backwards}
.vp-bar i:hover{filter:brightness(1.3)}
.vp-bar::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);transform:translateX(-120%)}
.rv.in .vp-bar::after{animation:vpGlare 6s 1.3s ease-in-out infinite}
@keyframes vpSegdrop{from{opacity:0;transform:translateY(-130%) scaleY(.3)}}
.vp-legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--vm)}
.vp-legend span{display:inline-flex;align-items:center;gap:6px}
.vp-legend b{font-family:var(--tech);color:var(--vt);font-weight:600}
.vp-sw{width:10px;height:10px;border-radius:3px;background:var(--c);flex:none}
/* cards with a cursor spotlight */
.vp-card{position:relative;margin-top:16px;padding:18px 20px;border-radius:20px;background:var(--vc);border:1px solid var(--vl);transition:border-color .3s}
.vp-card::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .35s;background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),rgba(170,150,255,.13),transparent 60%)}
.vp-card:hover{border-color:rgba(190,170,255,.3)}
.vp-card:hover::before{opacity:1}
.vp-card h3{display:flex;align-items:baseline;gap:10px;margin:0 0 12px;font-family:var(--serif);font-weight:650;font-size:20px;line-height:1.2}
.vp-grid{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:16px}
.vp-grid > .vp-card{container-type:inline-size}
@container (max-width:330px){ .vp-card .vp-split{grid-template-columns:minmax(0,1fr);justify-items:center} .vp-card .vp-sps{width:100%} }
/* source rows: rows slide in, each meter charges with a glowing vpComet head */
.vp-rows{display:grid;gap:2px;margin-top:6px}
.vp-row{display:grid;grid-template-columns:12px minmax(0,1fr) auto 150px;align-items:center;gap:12px;padding:9px 10px;border-radius:12px;transition:background .15s}
.vp-row.an{animation:vpSlidein .6s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes vpSlidein{from{opacity:0;transform:translateX(-18px)}}
.vp-row:hover{background:rgba(255,255,255,.05)}
.vp-row .nm b{display:block;font-weight:650;font-size:14.5px}
.vp-row .nm small{display:block;margin-top:1px;color:var(--vm);font-size:12.5px}
.vp-row .ct{font-family:var(--tech);font-size:13px;color:var(--vm);white-space:nowrap}
.vp-row .am{display:grid;gap:5px}
.vp-row .am > span{display:flex;align-items:center;justify-content:flex-end;gap:8px}
.vp-row .am b{display:inline-flex;align-items:center;gap:5px;font-family:var(--tech);font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.vp-row .am em{font-style:normal;font-family:var(--tech);font-size:12px;color:var(--vm);min-width:38px;text-align:right;font-variant-numeric:tabular-nums}
.vp-row .cni,.vp-sp .cni,.vp-ti .cni,.vp-f .cni,.vp-don .cni{width:16px;height:16px}
.vp-mt{position:relative;height:4px;border-radius:2px;background:rgba(255,255,255,.08)}
.vp-mt i{position:relative;display:block;height:100%;border-radius:2px;background:var(--c);box-shadow:0 0 8px color-mix(in srgb,var(--c) 70%,transparent)}
.vp-mt i.an{animation:vpCharge 1.3s cubic-bezier(.25,.8,.25,1) backwards}
.vp-mt i::after{content:"";position:absolute;right:-4px;top:50%;width:9px;height:9px;margin-top:-4.5px;border-radius:50%;background:#fff;box-shadow:0 0 8px 3px var(--c),0 0 2px 1px #fff;opacity:0}
.rv.in .vp-mt i.an::after{animation:vpComet 1.3s cubic-bezier(.25,.8,.25,1) var(--dl,0s) backwards}
@keyframes vpCharge{from{width:0}}
@keyframes vpComet{0%,75%{opacity:1}100%{opacity:0}}
.vp-row.zero{opacity:.45}
.vp-row.ghost .vp-sw{background:transparent;border:1.5px dashed var(--vm)}
.vp-row.ghost .am b{font-weight:600;color:var(--vm)}
.vp-row.ghost s{color:var(--vm)}
.vp-row.tot{border-top:1px solid var(--vl);border-radius:0 0 12px 12px;margin-top:4px;padding-top:12px}
.vp-row.tot .nm b{font-family:var(--tech);letter-spacing:.12em;text-transform:uppercase;font-size:12.5px;color:var(--vm)}
.vp-row.tot .am b{font-size:19px}
/* sets vs cosmetics: a donut that draws itself + LED bars that light up step by step */
.vp-split{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center}
.vp-don{position:relative;width:134px;height:134px}
.vp-don svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.vp-don circle{fill:none;stroke-width:15}
.vp-don .trk{stroke:rgba(255,255,255,.07)}
.vp-don .arc{stroke:var(--c);filter:drop-shadow(0 0 6px color-mix(in srgb,var(--c) 70%,transparent))}
.vp-don .arc.an{animation:vpDraw 1.2s cubic-bezier(.45,.05,.2,1) backwards}
@keyframes vpDraw{from{stroke-dasharray:0 400}}
.vp-don .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.vp-don .mid b{font-family:var(--tech);font-size:24px;font-weight:700;line-height:1}
.vp-don .mid small{margin-top:3px;font-size:12px;color:var(--vm)}
.vp-sps{display:grid;gap:16px;min-width:0}
.vp-sp{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:baseline}
.vp-sp .k{grid-column:1/-1;display:flex;align-items:center;gap:8px;font-weight:650;min-width:0}
.vp-sp .v{grid-column:1;display:inline-flex;align-items:center;gap:6px;min-width:0;font-family:var(--tech);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.vp-sp .p{grid-column:2;font-family:var(--tech);font-size:12.5px;color:var(--vm);text-align:right}
.vp-sp .d{grid-column:1/-1;font-size:12.5px;color:var(--vm)}
.vp-led{grid-column:1/-1;position:relative;height:10px;margin-top:5px;background:rgba(255,255,255,.08);-webkit-mask:repeating-linear-gradient(90deg,#000 0 8px,transparent 8px 11px);mask:repeating-linear-gradient(90deg,#000 0 8px,transparent 8px 11px)}
.vp-led i{display:block;height:100%;background:linear-gradient(90deg,color-mix(in srgb,var(--c) 75%,#000),var(--c) 70%,color-mix(in srgb,var(--c) 55%,#fff))}
.vp-led i.an{animation:vpCharge 1.4s steps(22,end) backwards}
/* version chart: bars bounce up in a vpWave, the best version pulses */
.vp-chart{position:relative;height:190px;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:6px;align-items:end;border-bottom:1px solid rgba(255,255,255,.22);background:repeating-linear-gradient(to top,transparent 0 calc(25% - 1px),rgba(255,255,255,.06) calc(25% - 1px) 25%)}
.vp-col{position:relative;height:100%;display:flex;align-items:flex-end;justify-content:center}
.vp-col i{display:block;width:min(100%,34px);height:var(--h);min-height:2px;background:linear-gradient(180deg,#a69cf2,#9085e9 40%);border-radius:4px 4px 0 0;transform-origin:bottom;transition:filter .15s}
.vp-col i.an{animation:vpRise .95s cubic-bezier(.34,1.56,.64,1) var(--dl,0s) backwards}
@keyframes vpRise{from{transform:scaleY(0)}}
.vp-col:hover i{filter:brightness(1.3)}
.vp-col.z i{background:rgba(255,255,255,.12)}
.vp-col.max i{box-shadow:0 0 18px rgba(144,133,233,.7)}
.rv.in .vp-col.max i{animation:vpRise .95s cubic-bezier(.34,1.56,.64,1) var(--dl) backwards,vpGlow 2.4s 1.6s ease-in-out infinite}
@keyframes vpGlow{50%{box-shadow:0 0 28px 4px rgba(170,155,255,.85);filter:brightness(1.15)}}
.vp-col .tl{position:absolute;bottom:calc(var(--h) + 5px);left:50%;transform:translateX(-50%);font-family:var(--tech);font-size:11.5px;font-weight:600;color:var(--vt);white-space:nowrap}
.vp-col .tl.an{animation:vpPop .5s cubic-bezier(.3,1.5,.5,1) backwards}
.vp-xl{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:6px;margin-top:7px}
.vp-xl span{text-align:center;font-family:var(--tech);font-size:11.5px;font-weight:600;color:var(--vm)}
/* top pieces: cards flip in, then tilt in 3D under the cursor */
.vp-top{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:10px;perspective:900px}
.vp-ti{position:relative;overflow:hidden;display:grid;grid-template-columns:20px 58px minmax(0,1fr);align-items:center;gap:10px;padding:8px 12px 8px 8px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid var(--vl);color:inherit;font:inherit;text-align:left;cursor:pointer;transform:perspective(700px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .2s ease-out,border-color .2s,background .2s,box-shadow .2s}
.vp-ti.an{animation:vpFlipin .7s cubic-bezier(.2,.9,.3,1.2) backwards}
@keyframes vpFlipin{from{opacity:0;transform:perspective(700px) rotateX(-75deg) translateY(16px)}}
.vp-ti:hover{border-color:color-mix(in srgb,var(--rc) 70%,transparent);background:rgba(255,255,255,.07);box-shadow:0 10px 26px rgba(0,0,0,.3),0 0 0 1px color-mix(in srgb,var(--rc) 30%,transparent)}
.vp-ti::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .2s;background:radial-gradient(220px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.16),transparent 55%)}
.vp-ti:hover::after{opacity:1}
.vp-ti:focus-visible{outline:2px solid #9fe6ff;outline-offset:2px}
.vp-ti .n{font-family:var(--tech);font-weight:700;font-size:13px;color:var(--rc);text-align:center}
.vp-ti .th{width:58px;height:58px;border-radius:12px;overflow:hidden;background:linear-gradient(160deg,var(--ra),var(--rb));display:grid;place-items:center}
.vp-ti .th img,.vp-ti .th svg{width:100%;height:100%;object-fit:cover;display:block}
.vp-ti .tx{min-width:0}
.vp-ti .tx b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13.5px;font-weight:650;line-height:1.22}
.vp-ti .tx small{display:flex;align-items:center;gap:6px;margin-top:5px;font-family:var(--tech);font-size:13.5px;font-weight:700;color:#dfe8ff}
.vp-ti .tx small span{font-family:var(--body);font-weight:500;font-size:12px;color:var(--vm)}
.vp-ti.r5 .n{text-shadow:0 0 10px rgba(227,169,74,.8)}
/* formula tiles: vpPop in, their accent vpLine draws from the centre */
.vp-fx{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.vp-f{position:relative;overflow:hidden;padding:13px 14px 13px;border-radius:14px;background:rgba(6,3,20,.28);border:1px solid var(--vl)}
.vp-f.an{animation:vpTilein .6s cubic-bezier(.2,.9,.3,1.15) backwards}
@keyframes vpTilein{from{opacity:0;transform:translateY(18px) scale(.94)}}
.vp-f::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--c);box-shadow:0 0 12px var(--c)}
.rv.in .vp-f.an::before{animation:vpLine .8s cubic-bezier(.2,.8,.2,1) var(--dl2,0s) backwards}
@keyframes vpLine{from{transform:scaleX(0)}}
.vp-f .k{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:650;color:#d6cff8}
.vp-f .eq{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-top:7px;font-family:var(--tech);font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.vp-f .eq em{font-style:normal;font-weight:500;color:var(--vm)}
.vp-f p{margin:6px 0 0;font-size:12.5px;line-height:1.4;color:var(--vm)}

/* ---------- theme backgrounds ---------- */
.bgfx{position:fixed;inset:-3%;z-index:-2;background:#0d0a1c center/cover no-repeat;opacity:0;transition:opacity 1.1s ease;pointer-events:none}
.bgfx.on{opacity:1}
body.bg-move .bgfx{animation:bgDrift 80s ease-in-out infinite alternate}
@keyframes bgDrift{from{transform:scale(1.02) translate(0,0)}to{transform:scale(1.1) translate(-2%,-1.5%)}}
.bgshade{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:0;transition:opacity .9s ease;background:radial-gradient(130% 100% at 50% 0%,rgba(13,10,28,calc(var(--bgd,.5) - .12)),rgba(13,10,28,var(--bgd,.5)) 55%,rgba(13,10,28,calc(var(--bgd,.5) + .2)))}
body.has-bg{background:#0d0a1c}
body.has-bg .bgshade{opacity:1}
body.has-bg .top{background:radial-gradient(120% 160% at 0% 0%,rgba(69,49,143,.78) 0%,rgba(39,28,88,.64) 42%,rgba(20,14,49,.76) 100%)}
body.bg-blur .bgfx{filter:blur(var(--bgb,0px)) saturate(1.1)}
.bgcv{position:fixed;inset:0;width:100%;height:100%;z-index:-2;opacity:0;transition:opacity 1s ease;pointer-events:none}
.bgcv.on{opacity:1}
body.bg-blur .bgcv{filter:blur(var(--bgb,0px))}
.bg-t canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
body.has-bg .top :is(.brand h1,.rk-label,.xp-txt,.rb,.node .np,.info-btn){text-shadow:0 0 1px rgba(8,4,24,.95),0 1px 2px rgba(8,4,24,.85),0 0 10px rgba(8,4,24,.6)}
body.has-bg .rk-name{filter:drop-shadow(0 1px 1px rgba(8,4,24,.9)) drop-shadow(0 0 6px rgba(8,4,24,.6))}
body.has-bg .rb .track,body.has-bg .xp-bar{background:rgba(10,6,30,.55);box-shadow:inset 0 1px 2px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.16),0 1px 4px rgba(8,4,24,.5)}
body.has-bg .constel::before{background:linear-gradient(90deg,rgba(190,170,255,.25),rgba(210,195,255,.75),rgba(190,170,255,.25));box-shadow:0 0 0 1px rgba(8,4,24,.45)}
body.has-bg .node svg{filter:drop-shadow(0 1px 3px rgba(8,4,24,.75))}
body.has-bg .node:hover svg{filter:drop-shadow(0 0 8px rgba(159,230,255,.75)) brightness(1.15)}
body.has-bg .orbit svg{filter:drop-shadow(0 2px 8px rgba(8,4,24,.6))}
body.has-bg .crest svg{filter:drop-shadow(0 0 10px var(--glow,#c58cff)) drop-shadow(0 1px 2px rgba(8,4,24,.8))}
body.has-bg .screen{background:color-mix(in srgb,var(--screen) var(--pa,88%),transparent);border-color:color-mix(in srgb,var(--shell) 70%,transparent)}
body.has-bg .toolbar{background:transparent}
.toolbar{transition:background .25s,border-color .25s}
.toolbar::before{content:"";position:absolute;z-index:-1;inset:0 -14px;border-radius:0 0 18px 18px;pointer-events:none;opacity:0;visibility:hidden;transition:opacity .3s,visibility 0s .3s;background:color-mix(in srgb,var(--screen) 62%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);box-shadow:0 12px 30px rgba(8,4,24,.28),inset 0 -1px 0 rgba(255,255,255,.08)}
.toolbar.stuck{background:transparent;border-bottom-color:transparent}
.toolbar.stuck::before{opacity:1;visibility:visible;transition:opacity .3s}
@media (max-width:640px){ .toolbar::before{inset:0 -10px} .toolbar.has-sub::before{display:none} }
.filters{scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.hbtn{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(255,255,255,.22);background:rgba(10,6,30,.35);color:#fff;padding:0;transition:transform .25s cubic-bezier(.3,1.5,.5,1),background .2s,box-shadow .2s}
.hbtn:hover{transform:rotate(-12deg);background:rgba(255,255,255,.12);box-shadow:0 0 18px rgba(160,140,255,.5)}
.hbtn svg{width:18px;height:18px}
.hbtn + .seg{margin-left:0}
#bgd{width:min(900px,calc(100% - 24px))}
#bgd::backdrop{background:rgba(8,5,22,.28);-webkit-backdrop-filter:none;backdrop-filter:none}
.bg-body{overflow:auto;padding:6px 18px 18px;overscroll-behavior:contain}
.bg-body > p{margin:0 0 10px;color:var(--muted);font-size:13.5px}
.bg-ctl{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;margin:0 0 6px;padding:10px 12px;border-radius:14px;background:var(--raise);border:1px solid var(--line)}
.bg-ctl .rng{display:flex;align-items:center;gap:10px;font-weight:600;font-size:13.5px}
.bg-ctl input[type=range]{accent-color:var(--accent);width:130px;max-width:40vw}
.bg-rst{margin-left:auto}
.bg-body h3{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px;font-family:var(--serif);font-weight:650;font-size:17px;margin:16px 0 8px}
.bg-body h3 small{font-family:var(--body);font-weight:500;font-size:12.5px;color:var(--muted)}
.bg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.bg-grid.wide{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.bg-grid.wide .bg-t{aspect-ratio:2/1}
.bg-t{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;border:2px solid var(--line);padding:0;background:#1d1640;color:#fff;cursor:pointer;transition:transform .2s,border-color .2s,box-shadow .2s;animation:bgTileIn .45s cubic-bezier(.2,.9,.3,1.2) backwards}
@keyframes bgTileIn{from{opacity:0;transform:translateY(10px) scale(.94)}}
.bg-t img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.bg-t:hover{border-color:var(--accent)}
.bg-t:hover img{transform:scale(1.1)}
.bg-t > span{position:absolute;left:0;right:0;bottom:0;padding:16px 8px 5px;font-size:12px;font-weight:650;line-height:1.2;text-align:left;background:linear-gradient(transparent,rgba(10,6,25,.88));text-shadow:0 1px 2px rgba(0,0,0,.5)}
.bg-t[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 45%,transparent),0 10px 24px rgba(30,15,80,.3)}
.bg-t[aria-pressed="true"]::after{content:"✓";position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);font-weight:800;font-size:13px;animation:fxPopIn .35s cubic-bezier(.3,1.6,.5,1)}
.bg-t.none{background:radial-gradient(120% 160% at 0% 0%,#45318f 0%,#271c58 42%,#140e31 100%)}
.bg-t.none::before{content:"";position:absolute;inset:0;background-image:radial-gradient(1.4px 1.4px at 20% 30%,#fff,transparent 70%),radial-gradient(1px 1px at 70% 20%,#fff,transparent 70%),radial-gradient(1.2px 1.2px at 45% 65%,#fff,transparent 70%),radial-gradient(1px 1px at 85% 70%,#fff,transparent 70%);opacity:.8}
.bg-t.own{display:grid;place-items:center;background:repeating-linear-gradient(45deg,rgba(255,255,255,.05) 0 10px,transparent 10px 20px),linear-gradient(160deg,#3b2f70,#1d1640)}
.bg-t.own svg{width:30px;height:30px;margin-bottom:14px;opacity:.9}
.bg-t.loading::before{content:"";position:absolute;inset:0;z-index:2;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);animation:fxSweep 1s linear infinite}
.bg-cred{font-size:12px;color:var(--muted);margin:16px 0 0}
@keyframes fxPopIn{from{transform:scale(0)}}

/* ---------- ambient effects ---------- */
.device{animation:fxBoot .8s cubic-bezier(.2,.8,.2,1)}
@keyframes fxBoot{from{opacity:0}}
.rk-name{background-size:220% 100%;animation:fxFlow 9s ease-in-out infinite alternate}
@keyframes fxFlow{to{background-position:100% 0}}
.worth{position:relative;overflow:hidden}
.worth::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 35%,rgba(200,220,255,.32) 50%,transparent 65%);transform:translateX(-120%);will-change:transform}
body.ready .worth::after{animation:fxGlare 7s 1s ease-in-out infinite}
@keyframes fxGlare{0%{transform:translateX(-120%)}18%,100%{transform:translateX(120%)}}
.node svg{transition:filter .2s}
.node:hover svg{filter:drop-shadow(0 0 8px rgba(159,230,255,.75)) brightness(1.15)}
@keyframes fxTab{to{background-position:200% 0}}
.stab{transition:background .15s,border-color .15s,color .15s,box-shadow .2s}
.stab:hover,.stab:focus-visible{z-index:45;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 60%,transparent),0 0 14px color-mix(in srgb,var(--accent) 30%,transparent)}
.stab .ci{transition:transform .2s cubic-bezier(.3,1.5,.5,1)}
.stab:hover .ci{transform:scale(1.14)}
.gprog .bar i{animation:fxCharge 1s cubic-bezier(.25,.8,.25,1) backwards}
@keyframes fxCharge{from{width:0}}
/* cards: wave-in when they scroll into view, 3D tilt + light under the cursor, a sweep of light when caught */
.blk.rv-wait > .card{opacity:0}
.blk.rv-in > .card{animation:fxCardIn .6s cubic-bezier(.2,.8,.2,1) var(--wd,0ms) backwards}
@keyframes fxCardIn{from{opacity:0;transform:scale(.94)}}
.card{transition:border-color .25s,transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s}
.card.tilt{z-index:2;transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));border-color:color-mix(in srgb,var(--rc) 75%,var(--line));box-shadow:0 8px 18px color-mix(in srgb,var(--rc) 26%,rgba(10,6,30,.25)),inset 0 0 22px color-mix(in srgb,var(--rc) 18%,transparent);transition:border-color .25s,transform .12s linear,box-shadow .3s}
.card.tilt .art::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(240px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.26),transparent 55%)}
.card.r5.tilt .art::after{background:radial-gradient(240px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.24),transparent 55%),linear-gradient(115deg,transparent 25%,rgba(255,214,140,.22) 42%,rgba(160,220,255,.2) 52%,rgba(236,170,255,.2) 62%,transparent 78%) calc(var(--mx,50%) * 1.4 - 20%) 0/260% 100% no-repeat;mix-blend-mode:screen}
.card.shine .art::before{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.7) 50%,transparent 70%);transform:translateX(-120%);animation:fxSweep .85s cubic-bezier(.3,.6,.3,1) forwards}
@keyframes fxSweep{to{transform:translateX(120%)}}
.orb{transition:transform .15s,background .2s,box-shadow .2s}
.orb:hover{box-shadow:0 0 0 3px rgba(255,255,255,.22)}
/* dialogs open with a soft zoom; tapping buttons leaves a ripple */
dialog[open]{animation:fxDlg .42s cubic-bezier(.2,.9,.2,1)}
dialog[open]::backdrop{animation:vpfade .35s ease;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
@keyframes fxDlg{from{opacity:0;transform:translateY(16px) scale(.96)}}
.dc .sfig img{animation:fxImg .7s cubic-bezier(.2,.8,.2,1)}
@keyframes fxImg{from{opacity:0;transform:scale(1.05)}}
.rpl-w{position:fixed;z-index:65;overflow:hidden;pointer-events:none}
.rpl{position:absolute;border-radius:50%;pointer-events:none;background:currentColor;opacity:.28;transform:scale(0);animation:fxRpl .6s ease-out forwards}
@keyframes fxRpl{to{transform:scale(1);opacity:0}}
.toast{position:relative;overflow:hidden;background:linear-gradient(135deg,#2a2150,#3b2f70);border:1px solid rgba(197,140,255,.35);box-shadow:0 8px 30px rgba(0,0,0,.3),0 0 26px rgba(156,133,255,.28)}
.toast::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.28) 50%,transparent 65%);transform:translateX(-120%);animation:fxSweep 1.1s .25s ease-out forwards}
@media (max-width:640px){ .hbtn{margin-left:auto;width:32px;height:32px} .hbtn svg{width:16px;height:16px} .hbtn:not([hidden]) + .hbtn{margin-left:0} }
@media (prefers-reduced-motion:reduce){ .blk.rv-wait > .card{opacity:1} .bgfx{animation:none!important} }

/* ---------- Google Drive sync ---------- */
.hbtn[hidden]{display:none}
#gdBtn{position:relative}
#gdBtn::after{content:"";position:absolute;right:2px;top:2px;width:9px;height:9px;border-radius:50%;background:#8a86a8;box-shadow:0 0 0 2px #2a1f5c}
#gdBtn[data-st="ok"]::after,#gdBtn[data-st="idle"]::after{background:#2fd39a}
#gdBtn[data-st="sync"]::after{background:#9fe6ff;animation:gdPulse 1s ease-in-out infinite}
#gdBtn[data-st="auth"]::after,#gdBtn[data-st="err"]::after{background:#ffb84d}
@keyframes gdPulse{50%{opacity:.35}}
.gd{display:grid;gap:10px;padding:14px;border-radius:14px;background:var(--raise);border:1px solid var(--line)}
.gd-h{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:start}
.gd-ic{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.gd-ic svg{width:22px;height:22px}
.gd-h h3{margin:0 0 2px;font-family:var(--serif);font-weight:650;font-size:16.5px}
.gd-st{justify-self:end;display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;white-space:nowrap;padding:5px 11px;border-radius:999px;background:var(--chip)}
.gd-st i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.gd-st[data-st="ok"] i,.gd-st[data-st="idle"] i{background:var(--ok)}
.gd-st[data-st="sync"] i{background:var(--accent);animation:gdPulse 1s ease-in-out infinite}
.gd-st[data-st="auth"] i,.gd-st[data-st="err"] i{background:var(--warn)}
.tools .gd-warn{color:var(--warn);font-weight:600}
.gbtn{display:inline-flex;align-items:center;gap:12px;height:42px;padding:0 18px 0 12px;border-radius:999px;border:1px solid #dadce0;background:#fff;color:#1f1f1f;font-family:"Roboto","Figtree",system-ui,sans-serif;font-weight:600;font-size:14.5px;box-shadow:0 1px 2px rgba(60,64,67,.25);transition:box-shadow .2s,background .2s}
.gbtn:hover{background:#f8f9fa;box-shadow:0 1px 3px rgba(60,64,67,.3),0 4px 10px rgba(60,64,67,.15)}
.gbtn:disabled{opacity:.55;cursor:not-allowed;box-shadow:none}
.gbtn .g-logo{width:20px;height:20px;flex:none}
.tools .gd-note{font-size:12.5px}
.gd-note a{color:var(--accent);font-weight:600}
.gd .btn:disabled{opacity:.5;cursor:not-allowed}
@media (max-width:640px){ .gd-h{grid-template-columns:auto minmax(0,1fr)} .gd-st{grid-column:2;justify-self:start} }
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>

/* ---------- data ---------- */
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const ci = cat => `<i class="ci ci-${slug(cat)}" aria-hidden="true"></i>`;
const IMG = "https://static.wikia.nocookie.net/gensin-impact/images/";
const SET_ICONS = new Set(SETS.flatMap(s=>[s[7],s[8]]));
// cosmetic icons are 256px originals: always ask for the same 300px URL so grid, picker, preview, detail and canvas share one cached file
const wsize = (w,p) => (/\/Item_/.test(p) && !SET_ICONS.has(p)) || w<=320 ? 300 : 600;
const wurl = (p,w) => { if(!p) return "";
  if(p.startsWith("fr:")){ const q=p.slice(3); return "https://static.wikia.nocookie.net/genshinimpact/images/" + q.split("/").map((x,i)=>i<2?x:encodeURIComponent(x)).join("/") + "/revision/latest/scale-to-width-down/300?path-prefix=fr"; }
  return IMG + p.split("/").map((x,i)=>i<2?x:encodeURIComponent(x)).join("/") + "/revision/latest/scale-to-width-down/" + wsize(w,p); };
const WIKI="https://genshin-impact.fandom.com/";
const SET_ITEMS = SETS.map(([en,fr,r,v,src,raw,wt,f,m,pf,pm,vfe,vme,vff,vmf,pr,vv],i)=>({kind:"set",id:slug(en),en,fr:fr||en,r,v,src:src.split(","),raw,wt,f,m,pf,pm,vf:{en:vfe,fr:vff||vfe},vm:{en:vme,fr:vmf||vme},no:i+1,
  val: pr ? {f:pr[0]?[pr[0],pr[1]]:null, m:pr[2]?[pr[2],pr[3]]:null} : null, viv: vv||[0,0]}));
const usedC = new Set();
const COMP_ITEMS = COMP.map(([en,fr,q,g,ty,cat,src,raw,v,p,si,key,mc,np,pr,vv],i)=>{ let id="c-"+slug(key||en); while(usedC.has(id)) id+="-x"; usedC.add(id);
  return {kind:"comp",id,en,fr:fr||en,r:q,g,ty,cat,src:src.split(","),raw,v,img:p,wt:key||en,wiki:np===1?WIKI+"wiki/Miliastra_Shop":np===2?WIKI+"fr/wiki/"+encodeURIComponent(fr.replace(/ /g,"_")):"",no:i+1,set:si>=0?SET_ITEMS[si]:null,mc:mc||"",val:pr||null,viv:vv||0}; });
// Event Ode banners: the 4★ sets of a banner come for free while pulling for its 5★
const FREE_WITH = new Map();
for(const [five,fours] of ODEB){ const F=SET_ITEMS.find(x=>x.en===five); if(!F) continue; for(const n of fours){ const it=SET_ITEMS.find(x=>x.en===n); if(it){ if(!FREE_WITH.has(it)) FREE_WITH.set(it,[]); FREE_WITH.get(it).push(F); } } }

const cnIcon = () => `<img class="cni" src="${CN_IMG}" alt="" aria-hidden="true">`;
const fmtN = n => Math.round(n).toLocaleString(ui.lang==="fr"?"fr-FR":"en-US");
const freeVia = (it,g) => { const fs=FREE_WITH.get(it); return fs && it.val && it.val[g] && it.val[g][1]==="o4" ? fs.find(F=>has(F,g))||null : null; };
const baseVal = (it,g) => !it.val ? 0 : it.kind==="set" ? (it.val[g]?it.val[g][0]:0) : (g==="x"?it.val[0]:0);
const valOf = (it,g) => it.kind==="set" && freeVia(it,g) ? 0 : baseVal(it,g);
const basisOf = (it,g) => !it.val ? "" : it.kind==="set" ? (it.val[g] ? (freeVia(it,g)?"o4f":it.val[g][1]) : "") : it.val[1];
const shownVal = it => it.kind==="set" ? (ui.g==="both" ? valOf(it,"f")+valOf(it,"m") : valOf(it,ui.g)) : valOf(it,"x");
function worth(){ let own=0, all=0;
  for(const it of ALL.sets) for(const g of ["f","m"]){ const v=valOf(it,g); if(!v) continue; all+=v; if(has(it,g)) own+=v; }
  for(const it of ALL.comp){ if(it.set || !it.val) continue; all+=it.val[0]; if(has(it,"x")) own+=it.val[0]; }
  return [own,all]; }
function priceChip(it){
  if(it.kind==="comp"){ if(it.set || !it.val) return ""; return `<span class="cnp b-${it.val[1]}" title="${esc(t("basis")[it.val[1]])}">${cnIcon()}${fmtN(it.val[0])}</span>`; }
  const gs = ui.g==="both" ? ["f","m"] : [ui.g];
  if(gs.every(g=>baseVal(it,g) && !valOf(it,g))) return `<span class="cnp b-o4f" title="${esc(t("basis").o4f)}">${cnIcon()}<s>${fmtN(baseVal(it,gs[0]))}</s></span>`;
  const vs=gs.map(g=>valOf(it,g)).filter(Boolean); if(!vs.length) return "";
  const b=basisOf(it, gs.find(g=>valOf(it,g))), same=vs.every(v=>v===vs[0]);
  return `<span class="cnp b-${b}" title="${esc(t("basis")[b])}${gs.length>1?" · "+esc(t("perVer")):""}">${cnIcon()}${same?fmtN(vs[0]):vs.map(fmtN).join(" / ")}${same&&vs.length>1?`<small>×${vs.length}</small>`:""}</span>`;
}
function vivChip(it){
  let txt;
  if(it.kind==="comp"){ const v=vivOf(it,"x"); if(!v) return ""; txt=fmtN(v); }
  else { const gs = ui.g==="both" ? ["f","m"] : [ui.g]; const vs=gs.map(g=>vivOf(it,g)).filter(Boolean); if(!vs.length) return ""; txt = vs.every(v=>v===vs[0]) ? fmtN(vs[0]) : vs.map(fmtN).join("/"); }
  return `<span class="vvp" title="${esc(t("vividL"))}">${vivIcon()}${txt}</span>`;
}
const vivLine = (v,bare) => `<span class="vline">${vivIcon()}<b>${fmtN(v)}</b>${bare?"":`<span>${esc(t("vividL"))}</span>`}</span>`;
function valueLine(it,g){
  const b=basisOf(it,g), v=valOf(it,g);
  if(it.kind==="comp" && it.set) return `<span class="vline"><span>${esc(t("basis").piece)}</span></span>`;
  if(it.kind==="set" && freeVia(it,g)) return `<span class="vline">${cnIcon()}<s>${fmtN(baseVal(it,g))}</s><span>${esc(t("freeWith")(nm(freeVia(it,g))))}</span></span>`;
  if(!v) return `<span class="vline none"><span>${esc(t("basis").none)}</span></span>`;
  return `<span class="vline">${cnIcon()}<b>${fmtN(v)}</b><span>${esc(t("basis")[b])}</span></span>`;
}

function sigil(item){

  const g = (THEMES.find(([re])=>re.test(low))||[0,"gem"])[1];

  let dots=""; for(let i=0;i<9;i++){const x=(h>>(i*3))%100, y=(h>>(i*2+4))%125; dots+=`<circle cx="${x}" cy="${y}" r="${(i%3)*.5+.6}" fill="#fff" opacity=".55"/>`;}
  const gid="g"+h;
  return `<svg viewBox="0 0 100 125" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="${gid}" x1="0" y1="0" x2=".35" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs>

}

function matchQ(it){ if(!q) return true; const s=q.toLowerCase(); return it.en.toLowerCase().includes(s)||it.fr.toLowerCase().includes(s)||(it.raw||"").toLowerCase().includes(s)||(!!it.set&&(it.set.en+" "+it.set.fr).toLowerCase().includes(s)); }
function pass(it, skip){
  const F=ui.f[ui.tab];
  if(it.kind==="comp" && !compVisible(it)) return false;
  if(!matchQ(it)) return false;
  if(skip!=="src" && F.src.length && !it.src.some(s=>F.src.includes(s))) return false;
  if(skip!=="r" && F.r.length && !F.r.includes(String(it.r))) return false;
  if(skip!=="v" && F.v.length && !F.v.includes(it.v)) return false;
  if(skip!=="cat" && F.cat && F.cat.length && !F.cat.includes(it.cat)) return false;
  if(skip!=="sub" && it.kind==="comp" && ui.sub && it.cat!==ui.sub) return false;
  if(skip!=="mem" && F.mem && F.mem.length && !F.mem.includes(it.set?"set":"solo")) return false;
  if(skip!=="st" && F.st.length){ const c=complete(it); if(!((F.st.includes("own")&&c)||(F.st.includes("miss")&&!c))) return false; }
  return true;
}

/* ---------- image warm-up (browser keeps wiki images cached for a year) ---------- */
const warmQ=[], warmed=new Set(); let warmActive=0, warmCb=null;
function warm(urls, front){
  const fresh=urls.filter(u=>u && !warmed.has(u)); fresh.forEach(u=>warmed.add(u));
  if(front) warmQ.unshift(...fresh); else warmQ.push(...fresh); pump();
}
function pump(){
  while(warmActive<6 && warmQ.length){ const u=warmQ.shift(); warmActive++;
    const im=new Image(); im.decoding="async"; im.referrerPolicy="no-referrer";
    const done=ok=>{ warmActive--; if(warmCb) warmCb(ok); setTimeout(pump,0); };
    im.onload=()=>done(true); im.onerror=()=>done(false); im.src=u; }
}

function slotsOf(it){

    const l=[...new Set(raw.split(";").map(x=>x.trim()).map(x=>x.startsWith("Pendant")?"Pendant 1":x).filter(x=>ALL_SLOTS.includes(x)))];
    return l.length?l:["Top"]; }

}

// single pendants can sit in either pendant slot: they fill Pendant 1 then Pendant 2, in the order they were added
function slotMap(L){ const m={}, its=lookItems(L);
  for(const it of its) if(!isPend(it)) slotsOf(it).forEach((s,k)=>{ m[s]={it,primary:k===0}; });
  const pends=its.filter(isPend);
  if(pends.length===1 && L.p2 && !m[PEND[1]]) m[PEND[1]]={it:pends[0],primary:true};
  else for(const it of pends){ const free=PEND.find(s=>!m[s]); if(free) m[free]={it,primary:true}; }
  return m; }
function place(it, target){ const sl=slotsOf(it); if(!sl.length) return;
  if(isPend(it)){
    const m=slotMap(look); if(!PEND.includes(target)) target=PEND.find(s=>!m[s] || m[s].it===it) || PEND[0];
    const occ=m[target] && m[target].it!==it ? m[target].it : null;
    let ids=look.i.filter(id=>id!==it.id && (!occ || id!==occ.id));
    const pend=ids.filter(id=>isPend(BYID.get(id))), rest=ids.filter(id=>!isPend(BYID.get(id)));
    const mm=slotMap({i:rest}); const fixed=PEND.filter(s=>mm[s]);          // a multi-piece item may already hold a pendant slot
    if(fixed.includes(target)) rest.splice(rest.indexOf(mm[target].it.id),1);
    const at = target===PEND[0] || fixed.includes(PEND[0]) ? 0 : Math.min(1,pend.length);
    pend.splice(at,0,it.id); look.i=rest.concat(pend); look.p2 = pend.length===1 && target===PEND[1] && !fixed.includes(PEND[1]); return; }
  look.i=look.i.filter(id=>{ const o=BYID.get(id); return o && !slotsOf(o).some(s=>sl.includes(s)); }); look.i.push(it.id); }
function unplace(slot){
  if(PEND.includes(slot)){ const m=slotMap(look), e=m[slot]; if(!e) return;
    const other=m[slot===PEND[0]?PEND[1]:PEND[0]]; look.i=look.i.filter(id=>id!==e.it.id); look.p2 = slot===PEND[0] && !!other && isPend(other.it); return; }

const IMGC=new Map();
const IMGR=new Map();
// canvas needs CORS-clean pixels: try the wiki CDN directly, then a CORS image proxy, never a tainting plain load
const corsTry = src => new Promise(res=>{ const i=new Image(); i.crossOrigin="anonymous"; i.referrerPolicy="no-referrer"; i.decoding="async";
  const tm=setTimeout(()=>{ i.src=""; res(null); },10000); i.onload=()=>{ clearTimeout(tm); res(i); }; i.onerror=()=>{ clearTimeout(tm); res(null); }; i.src=src; });
function loadImg(url){
  if(!url) return Promise.resolve(null);
  if(!IMGC.has(url)) IMGC.set(url, (async()=>{
    let i=await corsTry(url);
    if(!i){ const w=(url.match(/scale-to-width-down\/(\d+)/)||[])[1]; i=await corsTry("https://wsrv.nl/?url="+encodeURIComponent(url.replace(/^https?:\/\//,""))+(w?"&w="+w:"")); }
    if(i) IMGR.set(url,i); else IMGC.delete(url);
    return i;
  })());
  return IMGC.get(url);
}
let drawT=null, drawTok=0;
const scheduleDraw = () => { clearTimeout(drawT); drawT=setTimeout(drawLook,140); };
const RCOL={5:["#9a6326","#e0aa52"],4:["#5b479c","#a383e6"],3:["#2f5a8c","#62a0d6"],2:["#356b52","#68aa86"],0:["#5e5b74","#a5a2bb"]};

function wrapText(ctx,txt,maxW,maxLines){

  for(const w of words){ const tst=cur?cur+" "+w:w; if(ctx.measureText(tst).width<=maxW || !cur) cur=tst; else { lines.push(cur); cur=w; } }
  if(cur) lines.push(cur);
  if(lines.length>maxLines){ const keep=lines.slice(0,maxLines); let last=keep[maxLines-1]; while(ctx.measureText(last+"…").width>maxW && last.length>1) last=last.slice(0,-1); keep[maxLines-1]=last.trimEnd()+"…"; return keep; }
  return lines;
}
function drawTile(ctx,it,img,x,y,S,big,slot){

  const [a,b]=RCOL[it.r]||RCOL[0], r=K(big?30:20);
  ctx.save(); ctx.shadowColor="rgba(0,0,0,.4)"; ctx.shadowBlur=K(big?30:18); ctx.shadowOffsetY=K(big?12:7);
  const g=ctx.createLinearGradient(x,y,x+S*.4,y+S); g.addColorStop(0,a); g.addColorStop(1,b); ctx.fillStyle=g; rrect(ctx,x,y,S,S,r); ctx.fill(); ctx.restore();

  const shine=ctx.createRadialGradient(x+S*.3,y+S*.2,0,x+S*.3,y+S*.2,S*.9); shine.addColorStop(0,"rgba(255,255,255,.28)"); shine.addColorStop(1,"rgba(255,255,255,0)"); ctx.fillStyle=shine; ctx.fillRect(x,y,S,S);
  if(img){ const q=Math.min(S/img.naturalWidth,S/img.naturalHeight); const w=img.naturalWidth*q, h=img.naturalHeight*q; ctx.drawImage(img,x+(S-w)/2,y+(S-h)/2,w,h); }
  const ov=ctx.createLinearGradient(0,y+S*.52,0,y+S); ov.addColorStop(0,"rgba(12,8,30,0)"); ov.addColorStop(1,"rgba(12,8,30,.9)"); ctx.fillStyle=ov; ctx.fillRect(x,y+S*.5,S,S*.5);
  const pad=Math.max(7,K(big?18:11)); ctx.textBaseline="alphabetic";

  const lines=wrapText(ctx,nm(it),S-pad*2,2); const lh=Math.round(fs*1.23);
  lines.forEach((ln,i)=>ctx.fillText(ln,x+pad,y+S-pad-(lines.length-1-i)*lh));
  if(big){ ctx.font=`700 ${Math.max(11,K(14))}px "Chakra Petch", sans-serif`; ctx.fillStyle="rgba(235,228,255,.85)"; ctx.fillText((t("slotN")[slot]||slot).toUpperCase(),x+pad,y+S-pad-lines.length*lh-4); }
  if(it.r){ ctx.font=`${Math.max(9,K(big?20:13))}px sans-serif`; ctx.fillStyle=it.r===5?"#ffe6a6":"#ffffff"; ctx.shadowColor="rgba(0,0,0,.6)"; ctx.shadowBlur=4; ctx.fillText("★".repeat(it.r),x+pad,y+Math.max(14,K(big?32:22))); ctx.shadowBlur=0; }
  ctx.restore();

}
function accLabel(ctx,cx,y,half,x0,x1){

  if("letterSpacing" in ctx) ctx.letterSpacing="4px"; const lab=t("cvAcc").toUpperCase(); half=ctx.measureText(lab).width/2+18; ctx.fillText(lab,cx,y+12); if("letterSpacing" in ctx) ctx.letterSpacing="0px"; ctx.textAlign="left";

function paintPortrait(ctx,pic,main,small,imgOf,mainSlot,top,bot,W){

  let PH=bot-top, PW=Math.round(PH*9/16); if(PW>560){ PW=560; PH=Math.round(PW*16/9); }
  const PX=40, PY=bot-PH, cx=PX+PW/2;
  const q=Math.min(PW/pic.width,PH/pic.height), pw=pic.width*q, ph=pic.height*q;
  ctx.imageSmoothingQuality="high";
  if(pic._clear){
    const hal=ctx.createRadialGradient(cx,PY+PH*.42,10,cx,PY+PH*.42,PW*.8); hal.addColorStop(0,"rgba(186,160,255,.36)"); hal.addColorStop(1,"rgba(186,160,255,0)");
    ctx.fillStyle=hal; ctx.fillRect(PX-160,PY-80,PW+320,PH+160);
    ctx.save(); ctx.translate(cx,bot-14); ctx.scale(1,.15); const fg=ctx.createRadialGradient(0,0,0,0,0,PW*.48);
    fg.addColorStop(0,"rgba(226,214,255,.7)"); fg.addColorStop(.55,"rgba(160,130,255,.25)"); fg.addColorStop(1,"rgba(160,130,255,0)"); ctx.fillStyle=fg; ctx.fillRect(-PW*.5,-PW*.5,PW,PW); ctx.restore();
    ctx.save(); ctx.shadowColor="rgba(8,4,24,.55)"; ctx.shadowBlur=38; ctx.shadowOffsetY=14; ctx.drawImage(pic,cx-pw/2,bot-ph,pw,ph); ctx.restore();
  } else {
    const R=30;
    ctx.save(); ctx.shadowColor="rgba(6,3,20,.6)"; ctx.shadowBlur=40; ctx.shadowOffsetY=16; ctx.fillStyle="#1a1238"; rrect(ctx,PX,PY,PW,PH,R); ctx.fill(); ctx.restore();
    ctx.save(); rrect(ctx,PX,PY,PW,PH,R); ctx.clip(); ctx.drawImage(pic,cx-pw/2,PY+(PH-ph)/2,pw,ph);
    const sh=ctx.createLinearGradient(0,PY+PH*.7,0,PY+PH); sh.addColorStop(0,"rgba(12,8,30,0)"); sh.addColorStop(1,"rgba(12,8,30,.35)"); ctx.fillStyle=sh; ctx.fillRect(PX,PY,PW,PH); ctx.restore();
    ctx.save(); const bd=ctx.createLinearGradient(PX,PY,PX+PW,PY+PH); bd.addColorStop(0,"rgba(255,236,190,.85)"); bd.addColorStop(.5,"rgba(240,184,255,.55)"); bd.addColorStop(1,"rgba(159,230,255,.8)");
    ctx.strokeStyle=bd; ctx.lineWidth=3; rrect(ctx,PX+1.5,PY+1.5,PW-3,PH-3,R-1.5); ctx.stroke(); ctx.restore();
  }

    wrapText(ctx,t("cvEmpty"),RW-20,3).forEach((ln,i)=>ctx.fillText(ln,RX+RW/2,top+AH/2+i*36)); ctx.textAlign="left"; return; }
  const g=18, sg=12, rowsM=Math.ceil(main.length/2); let Lm=Math.floor((RW-g)/2), per=4, Ls=0, rowsS=0, need=0;
  for(per of [4,5,6]){ Ls=Math.floor((RW-(per-1)*sg)/per); rowsS=small.length?Math.ceil(small.length/per):0;
    need=(rowsM?rowsM*(Lm+g)-g:0)+(rowsS?(rowsM?30:0)+40+rowsS*(Ls+sg)-sg:0); if(need<=AH) break; }
  const f=Math.min(1,AH/need); Lm=Math.floor(Lm*f); Ls=Math.floor(Ls*f);

    for(let r=0;r<rowsS;r++){ const row=small.slice(r*per,(r+1)*per), tot=row.length*Ls+(row.length-1)*sg; let x=RX+(RW-tot)/2;

}
function paintLook(ctx, main, small, imgOf, mainSlot, pic){

/* in-game Cosmetic Plan sharing code: header + typed arrays (item ids…) + CRC32, XOR'd with a 3-byte key, in a shuffled base64 */

  const KEYS=[[57,24,32,62],[29,49,42,44],[5,39,47,13],[62,57,24,32],[15,5,7,39],[10,52,27,48],[46,61,25,32],[63,41,12,37],[61,57,40,44],[42,44,29,49]];

    const K=[0,1,2,3].map(j=>T[s[j]]^P0[j]), n=Math.floor(s.length*6/8), b=new Uint8Array(n);

    out.push(4,...u32(nw)); for(let i=0;i<nw*8;i++) out.push(i<nb.length?nb[i]:0);

    out.push(1,...u32(o.ids.length)); o.ids.forEach(()=>out.push(0));
    out.push(1,...u32(o.slots.length),...o.slots);
    out.push(2,...u32(o.vals.length)); o.vals.forEach(x=>out.push(x&255,(x>>8)&255));

  }

const PicDB=(()=>{ let dbp=null; const mem=new Map();
  const open=()=> dbp || (dbp=new Promise(res=>{ try{ const r=indexedDB.open("miliadex",1);
      r.onupgradeneeded=()=>{ if(!r.result.objectStoreNames.contains("pics")) r.result.createObjectStore("pics",{keyPath:"id"}); };
      r.onsuccess=()=>res(r.result); r.onerror=()=>res(null); r.onblocked=()=>res(null); }catch(e){ res(null); } }));
  const tx=(db,mode,fn)=>new Promise(res=>{ try{ const x=db.transaction("pics",mode); const rq=fn(x.objectStore("pics")); x.oncomplete=()=>res(rq?rq.result:true); x.onerror=x.onabort=()=>res(null); }catch(e){ res(null); } });
  return {
    async put(rec){ mem.set(rec.id,rec); const db=await open(); return db ? !!(await tx(db,"readwrite",s=>{ s.put(rec); return null; })) : false; },
    async get(id){ if(mem.has(id)) return mem.get(id); const db=await open(); if(!db) return null; const r=await tx(db,"readonly",s=>s.get(id)); if(r) mem.set(id,r); return r||null; },
    async del(id){ mem.delete(id); const db=await open(); if(db) await tx(db,"readwrite",s=>{ s.delete(id); return null; }); },
    async keys(){ const db=await open(); if(!db) return [...mem.keys()]; return (await tx(db,"readonly",s=>s.getAllKeys()))||[]; }
  };
})();
const PICC=new Map(), PICR=new Map();

    const url=URL.createObjectURL(rec.cut);
    const img=await new Promise(res=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>res(null); i.src=url; });
    if(img){ img._url=url; img._clear=!!(rec.auto||rec.mask); PICR.set(id,img); } else { URL.revokeObjectURL(url); PICC.delete(id); }

    }catch(e){ busy=false; if(e.auth) setStatus("auth"); else setStatus("err", t("gdNet")); }
    if(again){ again=false; sync(); }
  }
  const soon=()=>{ if(!cfg.on) return; clearTimeout(pushT); pushT=setTimeout(sync, 2500); };
  function poll(){ clearInterval(pollT); pollT=setInterval(()=>{ if(cfg.on && tok && document.visibilityState==="visible") sync(); }, 45000); }
  document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible" && cfg.on && tok) sync(); });
  window.addEventListener("focus", ()=>{ if(cfg.on && tok && Date.now()-cfg.at>8000) sync(); });
  const ago=ms=>{ const s=Math.round((Date.now()-ms)/1000); return s<10 ? t("gdNow") : s<60 ? t("gdSec")(s) : s<3600 ? t("gdMin")(Math.round(s/60)) : new Date(ms).toLocaleString(ui.lang==="fr"?"fr-FR":"en-US",{hour:"2-digit",minute:"2-digit",day:"numeric",month:"short"}); };
  function render(){
    const box=$("gd"), btn=$("gdBtn"); if(!box) return;
    const st = status==="ok" ? t("gdOk")(ago(cfg.at)) : t("gdSt")[status]||"";
    btn.hidden=!cfg.on; btn.dataset.st=status; btn.title=`Google Drive · ${st}${err?" · "+err:""}`; btn.setAttribute("aria-label", btn.title);
    const can=!local && CID && !CID.startsWith("/*");
    box.innerHTML=`<div class="gd-h"><span class="gd-ic" aria-hidden="true">${ICON_DRIVE}</span><div><h3>${esc(t("gdTitle"))}</h3><p>${esc(t("gdText"))}</p></div>${cfg.on?`<span class="gd-st" data-st="${status}"><i></i>${esc(st)}</span>`:""}</div>
      ${err?`<p class="gd-warn">${esc(err)}</p>`:""}
      ${cfg.on ? `<div class="row">${status==="auth"?`<button class="gbtn" type="button" data-gd="connect">${ICON_G}<span>${esc(t("gdReconnect"))}</span></button>`:`<button class="btn" type="button" data-gd="sync"${status==="sync"?" disabled":""}>${esc(t("gdSyncNow"))}</button>`}<button class="btn ghost" type="button" data-gd="off">${esc(t("gdDisconnect"))}</button></div>`
        : `<div class="row"><button class="gbtn" type="button" data-gd="connect"${can?"":" disabled"}>${ICON_G}<span>${esc(t("gdConnect"))}</span></button></div>${can?"":`<p class="gd-note">${esc(t("gdLocal"))}</p>`}`}
      <p class="gd-note"><a href="privacy.html" target="_blank" rel="noopener">${esc(t("gdPriv"))}</a></p>`;
  }
  $("gd").addEventListener("click", e=>{ const b=e.target.closest("[data-gd]"); if(!b) return; const a=b.dataset.gd;
    if(a==="connect") connect();
    else if(a==="sync") sync(); else if(a==="off") disconnect(); });
  $("gdBtn").addEventListener("click", ()=>{ if(status==="auth") connect(); else if(status!=="sync") sync(); });
  function init(){ render(); if(cfg.on){ poll(); if(tok) sync(); } }
  return {init, soon, render};
})();
gdHook=()=>GD.soon(); gdRender=()=>GD.render();

readHash(); renderAll(); applyBg(); syncPills(); GD.init();
// start the ambient loops once the first render has settled
window.addEventListener("load", ()=>{ const go=()=>document.body.classList.add("ready"); (window.requestIdleCallback ? requestIdleCallback(go,{timeout:2500}) : setTimeout(go,1200)); });
})();
</script>
</body>
